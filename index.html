<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>RPG Manager</title>
</head>


<body>
    <fieldset class="ficha-basico">
        <legend class="ficha-titulo">Ficha de Personagem</legend>

        <div class="campo">
            <label for="campo-nome">Nome</label>
            <input type="text" maxlength="30" id="campo-nome" name="nome">
        </div>
        <div class="campo">
            <label for="campo-raca">Raça</label>
            <input type="text" maxlength="15" id="campo-raca" name="raca">
        </div>
        <div class="campo">
            <label for="campo-classe">Classe</label>
            <input type="text" maxlength="15" id="campo-classe" name="classe">
        </div>
        <div class="campo">
            <label for="campo-nivel">Nível</label>
            <input type="number" min="1" max="20" id="campo-nivel" name="nivel">
        </div>
    </fieldset>

    <fieldset class="atributos">
        <legend class="atributos-titulo">Atributos</legend>

        <div class="campo">
            <label for="campo-forca">Força</label>
            <input type="number" min="1" max="20" name="forca" id="campo-forca">
        </div>

        <div class="campo">
            <label for="campo-destreza">Destreza</label>
            <input type="number" min="1" max="20" name="destreza" id="campo-destreza">
        </div>

        <div class="campo">
            <label for="campo-constituicao">Constituição</label>
            <input type="number" min="1" max="20" name="constituicao" id="campo-constituicao">
        </div>
        <div class="campo">
            <label for="campo-inteligencia">Inteligência</label>
            <input type="number" min="1" max="20" name="inteligencia" id="campo-inteligencia">
        </div>
        <div class="campo">
            <label for="campo-sabedoria">Sabedoria</label>
            <input type="number" min="1" max="20" name="sabedoria" id="campo-sabedoria">
        </div>
        <div class="campo">
            <label for="campo-carisma">Carisma</label>
            <input type="number" min="1" max="20" name="carisma" id="campo-carisma">
        </div>
    </fieldset>

    <fieldset class="combate">
        <legend class="combate-titulo">Combate</legend>
        <div class="campo">
            <label for="campo-hp-atual">HP atual</label>
            <input type="number" min="0" name="pontos-de-vida-atual" id="campo-hp-atual">
        </div>
        <div class="campo">
            <label for="campo-hp-max">HP máximo</label>
            <input type="number" min="0" name="pontos-de-vida-max" id="campo-hp-max">

        </div>
        <div class="campo">
            <label for="campo-ca">CA</label>
            <input type="number" min="0" max="30" name="classe-armadura" id="campo-ca">
        </div>
    </fieldset>


</body>


</html>
