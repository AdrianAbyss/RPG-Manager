<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Manager</title>
</head>


<body>
    <h1>Ficha de Personagem</h1>

    
    <div>
        <h2>Nome:</h2>
        <label for="campo-nome">Nome</label>
        <input type="text" maxlength="30" id="campo-nome" name="nome">
        <h2>Raça:</h2>
        <label for="campo-raca">Raça</label>
        <input type="text" maxlength="15" id="campo-raca" name="raça">
        <h2>Classe:</h2>
        <label for="campo-classe">Classe</label>
        <input type="text" maxlength="15" id="campo-classe" name="classe">
        <h2>Nível:</h2>
        <label for="campo-nivel">Nível</label>
        <input type="number" min="0" max="20" id="campo-nivel" name="nível">
    </div>

    <div>
        <h2>Atributos</h2>
        <h3>FOR:</h3>
        <label for="campo-forca">Força</label>
        <input type="number" min="1" max="20" name="força" id="campo-forca">
        <h3>DES:</h3>
        <label for="campo-destreza">Destreza</label>
        <input type="number" min="1" max="20" name="destreza" id="campo-destreza">
        <h3>CON:</h3>
        <label for="campo-constituicao">Constituição</label>
        <input type="number" min="1" max="20" name="constituição" id="campo-constituicao">
        <h3>INT:</h3>
        <label for="campo-inteligencia">Inteligência</label>
        <input type="number" min="1" max="20" name="inteligência" id="campo-inteligencia">
        <h3>SAB:</h3>
        <label for="campo-sabedoria">Sabedoria</label>
        <input type="number" min="1" max="20" name="sabedoria" id="campo-sabedoria">
        <h3>CAR:</h3>
        <label for="campo-carisma">Carisma</label>
        <input type="number" min="1" max="20" name="carisma" id="campo-carisma">
    </div>

</body>

</html>
